# The layer that needs a model.
#
# `verify` runs the OFFLINE scenarios on every push: the ones judged by reading
# an instruction and asking the real gate, without calling anyone. The
# behavioral ones are the other half — DAW gets installed into a real repo, a
# user's turns get sent at it, and then the REPO is asked what happened — and
# those cost money and minutes. That is why they live here: ON DEMAND only.
# There was a weekly cron and it was removed: every run charges gateway
# credits, and a Monday without balance paints the repo red while saying
# nothing about the code. The price is known: a broken scenario stays silent
# until the next manual run.
#
# What cannot happen, and this file is written for it: a run reporting green
# without having measured. `runner.py` already treats a scenario that cannot
# be judged as RED, and `--control` mode demands that every scenario go red
# against the regression it came from. Both run here.
name: behavioral

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model (opencode id). The free one runs out of turns and a timeout measures nothing."
        required: false
        default: opencode/claude-sonnet-5
      scenario:
        description: "One scenario by id, or empty for all behavioral ones"
        required: false
        default: ""

jobs:
  behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: The tools this layer cannot run without
        run: |
          python3 -m pip install --quiet pyyaml
          npm install -g opencode-ai

      # The controls re-inject the regression each scenario came from, and
      # some of those commits live on branches that are not ancestors of this one.
      - name: The history the controls reach back into
        run: git fetch --quiet --no-tags origin "+refs/heads/*:refs/remotes/origin/*" || true

      # Without the key there is no measurement, and a run that measured
      # nothing must NOT come out green: the `runner` counts an unjudgeable
      # scenario as red, but a workflow that never even tries would end green
      # for having run nothing. It fails here, on a line that says why.
      - name: The key this layer runs on
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY is not set. A behavioral run without a model measures nothing, and a green here would say the instructions were checked when nothing called one."
            exit 1
          fi

      - name: The instructions, in front of a model
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: ${{ inputs.model || 'opencode/claude-sonnet-5' }}
          ONLY: ${{ inputs.scenario }}
        run: |
          ARGS="--repo . --kinds behavioral --agent opencode --model $MODEL"
          [ -n "$ONLY" ] && ARGS="$ARGS --only $ONLY"
          python3 evals/runner.py $ARGS

      # The control, separate and always. A scenario that passes in normal
      # mode and does NOT go red with its regression in place is measuring
      # nothing, and that is the failure mode this layer has closest to hand:
      # the model's prose changes, the repo ends up the same, and the scenario
      # applauds.
      - name: And each one still goes red against the regression it came from
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: ${{ inputs.model || 'opencode/claude-sonnet-5' }}
          ONLY: ${{ inputs.scenario }}
        run: |
          ARGS="--repo . --kinds behavioral --agent opencode --model $MODEL --control"
          [ -n "$ONLY" ] && ARGS="$ARGS --only $ONLY"
          python3 evals/runner.py $ARGS
