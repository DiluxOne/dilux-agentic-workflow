id: paused-ticket-told-to-reclassify
kind: router-reachability

# The real regression this comes from.
regression:
  changelog: "0.20.0 — Out of IDLE, a paused ticket was told to reclassify"
  commit: 7dc4369
  what_happened: >
    The refusal said "From IDLE the only transition is --to CLASSIFY", and this
    very suite's happy path is the counterexample: a paused ticket re-enters
    the phase it was paused in, and that edge exits 0 on the very state the
    hint was printed for. Following it means throwing away work that was one
    flag from continuing — which is exactly the advice the pause was added,
    four commits earlier, to make unnecessary. The hint is read from the
    history now: if there is a pause, it names the phase it was left in and
    the `action` that resumes it.

given:
  install: claude
  # A paused ticket, in the exact shape `transition.py --to IDLE --action
  # "pause: …"` leaves behind: phase IDLE, tier and ticket null, and the pause
  # alive in the history. It is the state the false hint was printed on.
  state:
    phase: IDLE
    tier: null
    ticket: null
    title: null
    autonomy: null
    gates: {}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start: eval fixture", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:10:00Z", from: CLASSIFY, to: DEFINE, action: "classified", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:20:00Z", from: DEFINE, to: IDLE, action: "pause: setting aside for now", tier: FEATURE, ticket: T-1}

when:
  # The refusal is said by the HELPER: this hint only exists in the `main()` of
  # `transition.py`, and the hook never prints it.
  #
  # The trigger is what a reader coming back to their ticket does: ask for the
  # phase they left it in. Without `resume:` in the `action`, IDLE→DEFINE is
  # not in the graph and the helper refuses — the refusal is correct; what was
  # wrong was what it said afterwards.
  triggered_by:
    transition: ["--to", "DEFINE", "--action", "picking this back up",
                 "--tier", "FEATURE", "--ticket", "T-1"]

  # What the refusal has to be saying today: that the edge DOES exist, which
  # phase the pause was left in, and that the proof is the `action`. The broken
  # version said the opposite — "the only transition is --to CLASSIFY" — on
  # this same state, so this sentence is the one that discriminates.
  refusal_matches: 'This ticket was paused in DEFINE, so the edge you want exists.*resume: <why now>'

  # The resume edge, exactly as the refusal writes it. It has to exit 0 and
  # move the state: if the refusal names a move the graph does not offer, the
  # reader stays where they were.
  prescribed_steps:
    - ["--to", "DEFINE", "--action", "resume: picking this back up",
       "--tier", "FEATURE", "--ticket", "T-1"]

expect:
  every_step_succeeds: true

# The control: `substitute`, not `restore_from_commit`.
#
# The fix's commit lives on a branch that is NOT an ancestor of this one. A
# local clone has it and a CI checkout does not, so over there the control
# could not be applied — and since an inapplicable control FAILS instead of
# counting as red, it put the whole CI in red for a reason that is not the
# scenario's. Reinjecting the defect onto HEAD depends neither on branch
# topology nor on clone depth.
control:
  type: substitute
  path: daw/scripts/transition.py
  installed_path: .daw/scripts/transition.py
  old: |-
    "This ticket was paused in %s, so the edge you want exists — as a resume, "
  new: |-
    "From IDLE the only transition is --to CLASSIFY. Run that first. "
