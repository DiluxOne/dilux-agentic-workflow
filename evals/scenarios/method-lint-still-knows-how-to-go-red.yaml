id: method-lint-still-knows-how-to-go-red
kind: method-lint

regression:
  changelog: "0.21.0 — «A field the boot does not name does not survive a compaction»"
  commit: b605648
  what_happened: >
    `scripts/lint_method.py` is the only instrument that checks the method's
    PROSE against its data, and the suite only asks it whether it is green
    today. Nobody asks it whether it still knows how to go red. A prose linter
    breaks silently: a section gets renamed, the check stops finding what it
    was looking at, and it keeps reporting green for want of anything else to
    say — which is the whole family in `docs/CHECKS-THAT-CANNOT-FAIL.md`, five
    of which already shipped here.

    The assertion this scenario breaks is the one that cost a release:
    `autonomy` entered the state schema and was left out of the list the Boot
    Sequence recovers, so every compaction forgot the mode and the pipeline
    went back to asking about every edge to someone who had said not to ask.
    Nothing failed and the state on disk was perfect.

given: {}

# There is no `when`: the verdict IS the linter, run over the method's tree —
# the original in normal mode, the copy with the defect reinjected in control
# mode. A `lint_method` that does not print its verdict line came out neither
# green nor red: it fell over before judging, and that is ERROR, never a pass.

expect:
  clean: true

control:
  type: substitute
  edits:
    - path: daw/orchestrator.md
      installed_path: .daw/orchestrator.md
      old: |-
        extract `phase`, `tier`, `ticket`,
           `title`, `tracker`, `autonomy`, `block`, `discovery`. **`autonomy` absent or null means
           `assisted`.**
      new: |-
        extract `phase`, `tier`, `ticket`,
           `title`, `tracker`, `block`, `discovery`.
  # The linter has to go red FOR THIS. A control that goes red on some other
  # assertion did not prove it can hunt its own — it is the same defect as the
  # controls that failed with a `TypeError`, in a better disguise, and the
  # runner counts it as a failed control (`control off-target`), not as red.
  finding_matches: "Boot Sequence does not recover .*`autonomy`"
