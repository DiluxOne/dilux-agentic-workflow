id: painted-door-sweep
kind: painted-door-sweep

# This one does not come from a regression: it comes from the four that do,
# and from the fact that all four were found AFTER shipping. The
# `painted-door` scenarios pin a regex on a file and re-find a door that
# already opened. This one looks for the next.
regression:
  changelog: "0.19.0, 0.9.2 and 0.20.0 — four painted doors, four times found late"
  commit: 3b145df
  what_happened: >
    `/daw-eject` ordered the method copied to `.daw/`, which every phase
    refuses. The corrupt-state refusal ordered two writes it itself refused.
    INSTALL.md described the eject as "copies the method". No check saw any of
    them: the hooks were right, the instruction was wrong, and nothing asked
    the instruction anything. Each one was fixed with a scenario that re-finds
    it; none of those scenarios would have found the other three. This asks
    the gate about EVERY write the method orders.

given:
  install: claude
  state:
    tier: FEATURE
    ticket: T-1
    title: sweep fixture
    autonomy: assisted
    gates: {define: true, spec: true, threat: true}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start"}

when:
  corpus:
    - "skills/*/SKILL.md"
    - "daw/rules/*.instructions.md"
    - "daw/orchestrator.md"
  # Every order is judged in these phases and it takes only ONE refusing it for
  # it to be a painted door: the file that orders it does not say in which
  # phase it will be asked for, and a skill is invoked wherever the user
  # pleases.
  #
  # CODE and CLOSEOUT are left out on purpose: code can be written there, so a
  # permitted write says nothing, and one refused there is refused in all the
  # others too.
  phases: [DEFINE, PLAN, VERIFY]

expect:
  no_ordered_write_is_refused: true

# The control: the eject skill as it shipped at 3b145df^, with "**Copy** the
# method to `.daw/`" in its protocol. The sweep has to find it without anyone
# telling it where to look — which is the whole difference from
# `painted-door`.
control:
  type: restore_from_commit
  commit: 3b145df^
  path: skills/daw-eject/SKILL.md
