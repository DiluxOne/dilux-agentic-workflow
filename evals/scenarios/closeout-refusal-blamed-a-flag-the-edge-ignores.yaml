id: closeout-refusal-blamed-a-flag-the-edge-ignores
kind: router-reachability

# The real regression this comes from.
regression:
  changelog: "0.18.0 — The sanctioned helper could not close a ticket in any tier"
  commit: 5eec088
  what_happened: >
    `CLOSEOUT→IDLE` asks for `commit` and `pr`. Reaching IDLE clears the gates,
    so the `--gate` passed in that same run was silently discarded and the new
    state came out with `tier: null` by construction — which dropped the
    refusal into the tier branch, saying "The tier is missing: pass
    --tier <…>", a flag that edge ignores. The obedient reader passed it, the
    refusal came out identical, and the path the method orders you to take —
    the sanctioned helper — could not close a ticket in ANY tier. A fixed
    point, and the advice pointed at the one place where there was nothing to
    fix. Gates are now earned in the phase that owns them: `--claim commit
    --claim pr` in a run that takes no edge, and then the edge.

given:
  install: claude
  # A FEATURE at the end of the pipeline: everything earned except what the
  # closing edge charges. It is the exact state this was measured on — the
  # ticket that finished and cannot be closed.
  state:
    phase: CLOSEOUT
    tier: FEATURE
    ticket: T-1
    title: eval fixture
    autonomy: assisted
    gates: {define: true, spec: true, threat: true, tests: true, sast: true, verify: true}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start: eval fixture", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:10:00Z", from: CLASSIFY, to: DEFINE, action: "classified", tier: FEATURE, ticket: T-1}

when:
  # The refusal is said by the HELPER: this hint lives only in the `main()` of
  # `transition.py` and the hook never prints it. The trigger is what anyone
  # does when they finish: ask for the closeout.
  triggered_by:
    transition: ["--to", "IDLE", "--action", "close: the work is done"]

  # The two halves, and the negative is the one that discriminates.
  #
  # `(?!.*--tier)` over the whole message: the broken version sent you to
  # `--tier`, and that is the sentence that must never be seen again. Without
  # the negative the scenario would pass the control, because the tier refusal
  # is also a refusal.
  #
  # And the positive anchors the step replicated below: if the refusal stopped
  # naming `--claim commit --claim pr`, what gets tested afterwards would not
  # be what the refusal prescribes.
  refusal_matches: '^(?!.*--tier).*Gates are earned in the phase that owns them.*Run `--claim commit --claim pr` first'

  # The move the refusal prescribes, to the letter: first the run that marks
  # the gates without taking an edge, then the edge. Both have to exit 0 and
  # the state has to end in IDLE — if the second one refused again, it would be
  # the fixed point all over again.
  prescribed_steps:
    - ["--claim", "commit", "--claim", "pr"]
    - ["--to", "IDLE", "--action", "close: the work is done"]

expect:
  every_step_succeeds: true

# The control: `substitute`. The fix's commit (5eec088) is NOT an ancestor of
# this branch — `git merge-base --is-ancestor 5eec088 HEAD` exits non-zero — so
# a CI checkout cannot restore anything from it and the control would fail for
# a reason that is not the scenario's.
#
# The exact historical message is reinjected: the tier hint, on an edge that
# ignores the tier. With it in place, the refusal still comes out (the gate is
# still missing) but it no longer prescribes the move this scenario replicates,
# and the scenario cannot judge anything — which is what was happening to the
# reader.
control:
  type: substitute
  path: daw/scripts/transition.py
  installed_path: .daw/scripts/transition.py
#
# Written as a quoted scalar and not as a `|-` block: a YAML block swallows the
# indentation of its first line, and these four lines live twenty spaces deep
# inside an `elif`. YAML's indentation indicator only goes up to 9. It is the
# same idiom `painted-door-corrupt-state-scratch` uses.
  old: "                    \"Gates are earned in the phase that owns them, not on the edge out of it: \"\n                    \"`--gate` is not read on --to IDLE, because reaching IDLE clears the gates. \"\n                    \"Run `--claim %s` first (one run, no phase change), then take this edge.\"\n                    % \" --claim \".join(owed)"
  new: "                    \"The tier is missing: pass --tier <\" + \"|\".join(_tiers(graph)) + \"> \"\n                    \"(it is set on the CLASSIFY->DEFINE/DISCOVERY transition).\""
