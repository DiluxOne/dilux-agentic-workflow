id: fix-plan-passes-its-own-gate
kind: template-vs-gate

regression:
  changelog: "0.18.0 round three — The fix-plan template could not pass the gate it is written for"
  commit: 7dc4369
  what_happened: >
    A plan written exactly as `daw-create-spec` teaches was refused by F-SPEC-10
    for its layout: the template put error handling in prose, and the validator
    counts errors as a list, because F-SPEC-16 pairs each one with the test that
    names it. The reader is told "your plan is incomplete" about a plan written
    from the repository's own instructions, and there is no move that fixes it.
    Third member of this family — the PRD template, the test report and the
    verification verdict each had the same defect.

given:
  install: claude
  state: null

when:
  instruction: skills/daw-create-spec/SKILL.md
  # Pull the worked document straight out of the skill the model is told to load.
  extract_between: '###\s+The fix-plan, in the shape the validator reads.*?```markdown\n(.*?)\n```'
  ticket: FIX-001
  write_to: docs/daw/specs/fix-plan-FIX-001.md
  validator: validate_spec.py
  validator_args: ["${ARTIFACT}", "--tier", "FIX"]

expect:
  validator_accepts_the_worked_document: true

# Before 7dc4369 the skill carried no worked fix-plan — "there was nothing to
# copy and every draft was a guess". The scenario has to go red for that too: a
# skill with no canonical shape cannot be judged, and what cannot be judged is
# red.
#
# `substitute` and not `restore_from_commit`: that commit lives on a branch
# that is NOT an ancestor of this one, so a CI checkout does not have it and
# the control could not be applied — red for a reason that is not the
# scenario's. Taking the title off the worked document is the same state: there
# is nowhere to extract it from.
control:
  type: substitute
  path: skills/daw-create-spec/SKILL.md
  old: |-
    ### The fix-plan, in the shape the validator reads
  new: |-
    ### A fix-plan, roughly
