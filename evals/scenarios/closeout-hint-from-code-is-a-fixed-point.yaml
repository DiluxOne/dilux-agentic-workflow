id: closeout-hint-from-code-is-a-fixed-point
kind: router-reachability

# The real regression this comes from.
regression:
  changelog: "0.20.0 — On the way to IDLE, the hint prescribed gates the edge never asks for"
  commit: 7dc4369
  what_happened: >
    `--to IDLE` from CODE is refused because there is no CODE→IDLE edge, and the
    hint that came with that refusal was glued to EVERY state that reached that
    branch: "Run `--claim commit --claim pr` first (one run, no phase change),
    then take this edge". From CLOSEOUT that is the right sentence; from CODE
    both claims exited 0, the retry printed the same refusal word for word, and
    the reader was left with only one conclusion: the tool is broken. A fixed
    point — you do what you were told, the gates are now true, there is nothing
    to spend them on and the refusal did not move. The hint is read from the
    graph now: the gates where the edge asks for them, and which phase closes a
    ticket where that edge does not exist.

given:
  install: claude
  # Mid-ticket in CODE, tier FEATURE: the phase a model asks to close from and
  # the one the graph has no edge to IDLE from. It is the exact state the fixed
  # point was measured on.
  state:
    phase: CODE
    tier: FEATURE
    ticket: T-1
    title: eval fixture
    autonomy: assisted
    gates: {define: true, spec: true, threat: true}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start: eval fixture", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:10:00Z", from: CLASSIFY, to: DEFINE, action: "classified", tier: FEATURE, ticket: T-1}

when:
  # Who says the refusal: the HELPER. The two hints 7dc4369 fixed live only in
  # the `main()` of `transition.py` — the hook never prints them — so the only
  # way to assert on the text the reader actually sees is to run the helper and
  # read its stderr.
  triggered_by:
    transition: ["--to", "IDLE", "--action", "close: the work is done"]

  # The two halves of the refusal, in the order they come out and on the same
  # line.
  #
  # The first is from `validate()` and never changed: leaving a ticket without
  # closing it is written into the `action`. The second is the one 7dc4369
  # fixed, and it is the one that discriminates: the broken version said "Run
  # `--claim commit --claim pr` first" here, and neither of these two sentences
  # appeared.
  #
  # BOTH are required on purpose. With the first alone the scenario would pass
  # the control — that sentence is in both versions — and with the second alone
  # the step replicated below would not be anchored to any text.
  refusal_matches: 'pause: <reason>.*no CODE→IDLE edge in tier FEATURE — the closeout is taken from CLOSEOUT'

  # The move the refusal prescribes, to the letter, and which the sanctioned
  # helper has to accept.
  #
  # The pause is replicated, not the route to CLOSEOUT, because the pause is
  # what this refusal offers FROM THIS PHASE in a single move: the refusal says
  # the edge is what is missing, not the evidence, and reaching CLOSEOUT means
  # walking the whole pipeline with its artifacts — which is precisely what the
  # broken hint promised to skip with two `--claim`s. If this exits 0 and moves
  # the state, the refusal has a way out; if it did not, it would be the fixed
  # point all over again.
  prescribed_steps:
    - ["--to", "IDLE", "--action", "pause: the closeout is taken from CLOSEOUT, not from here"]

expect:
  every_step_succeeds: true

# The control: `substitute`, not `restore_from_commit`. The fix's commit lives
# on a branch that is NOT an ancestor of this one: a local clone has it, a CI
# checkout does not, and a control that cannot be applied fails — for a reason
# that is not the scenario's. Reinjecting the defect onto HEAD does not depend
# on the topology.
control:
  type: substitute
  path: daw/scripts/transition.py
  installed_path: .daw/scripts/transition.py
  old: |-
    "There is no %s→IDLE edge%s — the closeout is taken from %s. Claiming gates "
  new: |-
    "There is no way out of %s%s. The closeout belongs to %s. Claiming gates "
