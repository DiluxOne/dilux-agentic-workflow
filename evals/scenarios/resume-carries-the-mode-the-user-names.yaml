id: resume-carries-the-mode-the-user-names
kind: behavioral

# MEASURED STABILITY (opencode / opencode/deepseek-v4-flash-free, 2026-08-09)
#   normal:  5 of 5 PASS.
#   control: 2 of 2 red, and with the guard's own message — "the state ended in
#            'IDLE', not 'DEFINE'; state.autonomy is None" — which is the
#            regression and not a crash.

regression:
  changelog: "0.20.x — `autonomy` may be chosen again when a paused ticket is resumed"
  commit: 2d6163e
  what_happened: >
    Reaching IDLE clears `autonomy`, so a pause took the mode with it and the
    only way back was to abandon the ticket and classify it again — throw away
    the work to recover a preference. Resuming is now the only other place
    that field can be written, and the pause protocol forces the previous
    value onto the table BEFORE restoring anything: this ticket was running in
    minimal, two days went by, do we keep it?
  what_this_can_and_cannot_see: >
    The commit says it itself: "what the hook cannot see is whether the
    question was asked". This scenario does NOT assert that the question was
    asked — that can only be read in the prose, and the prose does not vote
    here. What IS a question about the repo is where the mode the user named
    ends up: `autonomy` can only be written in CLASSIFY and on the resume
    edge, so a model that resumes BEFORE asking keeps the old value and cannot
    change it afterwards — the gate refuses the correction, and the ticket
    ends up walking in the mode nobody chose. That is exactly the cost 2d6163e
    removed, and it can be read in the state file.

given:
  context_file: "Python 3, pytest."

  # A paused ticket, in the exact shape `transition.py --to IDLE --action
  # "pause: …"` leaves behind: phase IDLE, `tier`/`ticket`/`autonomy` null, and
  # the pause alive in the history. The same fixture
  # `paused-ticket-told-to-reclassify` uses, with two conditions that make it
  # actually runnable:
  #
  #   · The pause is in DEFINE and not further on. Post mode revalidates the
  #     whole run against the graph and charges the gates on every edge the
  #     journal has not yet blessed — and a freshly installed repo's journal is
  #     empty. A seeded history that passes through DEFINE→PLAN asks for the
  #     receipt of a PRD no fixture can write, and the repo starts stuck.
  #   · `autonomy` null, i.e. `assisted`. The scenario asks for MINIMAL on
  #     resume: if the fixture already came in minimal, a model that restores
  #     the old value without asking would be indistinguishable from one that
  #     asked. By asking for the opposite of what was there, the final state
  #     says which of the two things happened.
  state:
    phase: IDLE
    tier: null
    ticket: null
    title: null
    autonomy: null
    gates: {}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start: eval fixture", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:10:00Z", from: CLASSIFY, to: DEFINE, action: "classified", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:20:00Z", from: DEFINE, to: IDLE, action: "pause: lo dejamos para la semana que viene", tier: FEATURE, ticket: T-1}

when:
  turns:
    # 1. What someone coming back to their ticket says. The pause protocol
    #    orders asking about the mode BEFORE restoring anything, so at this
    #    point there should not yet be a written edge.
    - "volvamos al ticket T-1, el que dejamos pausado en DEFINE la semana pasada"
    # 2. The answer, and it is the one that CHANGES the mode relative to what
    #    was there. If it already resumed on its own in turn 1, this correction
    #    cannot land: the gate only lets `autonomy` be touched on the resume
    #    edge, and that edge already passed.
    - "dale, retomalo. pero esta vez andá solo: modo minimal, no me preguntes en cada paso"
  timeout: 900

expect:
  # The ticket came back to the phase it was paused in — it was not
  # reclassified from scratch, which is the advice 2d6163e exists to not have
  # to give.
  state_phase: DEFINE

  # And the mode it came back with is the one the user named in turn 2.
  # `ticket` is included too because an abandonment followed by a
  # reclassification also reaches minimal, and it is not the same thing: there
  # the paused work was thrown away.
  state:
    autonomy: minimal
    ticket: T-1
    tier: FEATURE

# The control: `_check_autonomy`'s `resuming`, switched off — the product from
# before 2d6163e, where the only moment the mode could be chosen was CLASSIFY.
# With that, the resume that names `--autonomy minimal` is refused with the
# guard's own message ("`autonomy` changed None→'minimal' outside CLASSIFY"),
# and the state ends up without the mode the user asked for.
#
# It is the mutation `scripts/mutate.py` already carries for this same
# regression ("resuming stops being a moment the mode can be chosen, so a
# pause loses it"), and since it mutates today's tree it does not depend on the
# commit being reachable from the checkout that runs the eval.
control:
  type: substitute
  path: daw/scripts/validate-transition.py
  installed_path: .daw/scripts/validate-transition.py
  old: "    resuming = any(_is_resume(e) and e.get(\"from\") == IDLE"
  new: "    resuming = False and any(_is_resume(e) and e.get(\"from\") == IDLE"
