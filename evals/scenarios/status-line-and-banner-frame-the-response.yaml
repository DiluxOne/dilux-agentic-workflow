id: status-line-and-banner-frame-the-response
kind: behavioral

# MEASURED STABILITY (claude / sonnet, Max subscription, 2026-08-25 — the same
# day it was written):
#   normal:  1 of 2 PASS. The run that passed emitted the full format — 📋
#            opening, 🙋 TU TURNO closing, Spanish with the fixed marker, and
#            the state stayed in DEFINE. The one that failed omitted the
#            status line with the rules INTACT. Meaning: even Claude complies
#            with the format INTERMITTENTLY, which is the behavior this
#            scenario exists to see — the first measurement alone would have
#            lied in either direction (the minimal scenario's lesson, again).
#   control: 1 of 1 RED as it should be — with the rule removed from all three
#            carriers, neither status line nor banner. The scenario
#            discriminates with this agent.
#   → With normal intermittent, it can NOT have veto power in CI until a
#     longer batch states its base rate. Run it on demand, read the
#     transcript of the red ones.
#
# Written on 2026-08-25, the day a general run with Copilot showed the whole
# hole: one model omitted the status line and the 🙋 banner for the ENTIRE
# run — assisted included, where the banner is the only thing telling the user
# the run is waiting — and the model that took over the session after a
# compaction emitted them every time. Same repo, same rules. Nothing could go
# red on that: verify_install greps that the orchestrator CONTAINS the section
# and the string `🙋 YOUR TURN`, not that the agent emits them, and no expect
# in any scenario looked at the transcript. This is the first one that does
# (the runner's `transcript_matches` key was born with it).

regression:
  rationale: >
    daw/orchestrator.md § Status Line ("Every response you give MUST start
    with a status line. No exceptions.") and § Your turn ("When a response
    ends waiting on the user … its last lines are this banner"). The method's
    two most frequent format demands, sustained by prose alone.
  what_happened: >
    Measured live (Copilot CLI 1.0.80, 2026-08-25): a ticket's entire assisted
    phase ran without a single status line and without a single banner — the
    user could not tell "it is waiting for my answer" from "it is still
    working", and said so. The enforcement cannot read the text of a response;
    an eval can.

given:
  context_file: "Python 3, pytest."
  branch: feat/T-1-borrado-de-cuenta

  # An assisted ticket standing in DEFINE, with the PRD already complete — the
  # number the sibling scenario leaves pending is decided here, so the
  # validation can pass and the run reaches the part THIS scenario measures:
  # presenting and standing by.
  state:
    phase: DEFINE
    tier: FEATURE
    ticket: T-1
    title: "Borrado de cuenta"
    autonomy: assisted
    gates: {}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start: eval fixture", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:10:00Z", from: CLASSIFY, to: DEFINE, action: "classified", tier: FEATURE, ticket: T-1}

  files:
    docs/daw/prd/prd-T-1.md: |
      # PRD T-1: Borrado de cuenta

      | Field | Value |
      |-------|-------|
      | Ticket | T-1 |
      | Tracker | none |
      | Date | 2026-01-01 |
      | PRD loops | 0 |
      | Loops since last human decision | 0 |

      ## Context and Problem
      Los usuarios no tienen forma de darse de baja y borrar sus datos.

      ## Goals
      Que el usuario pueda pedir la baja, que la cuenta se elimine y que los datos se purguen.

      ## Functional Requirements
      - FR-01: El usuario puede solicitar la baja de su cuenta desde su perfil.
      - FR-02: La baja elimina la cuenta y purga los datos personales asociados.

      ## Non-Functional Requirements
      - NFR-01: Tiempo máximo de respuesta del endpoint de baja: 2 segundos (p95).

      ## Acceptance Criteria
      - AC-01 (FR-01): WHEN el usuario confirma la baja, THE sistema SHALL registrar la solicitud.
      - AC-02 (FR-01): IF la confirmación falla, THEN THE sistema SHALL dejar la cuenta intacta.
      - AC-03 (FR-02): WHILE la purga está en curso, THE sistema SHALL impedir el login.

      ## Out of Scope
      - Exportar los datos antes de borrarlos.

      ## Risks and Mitigations
      Borrado irreversible: se confirma en dos pasos.

      ## Dependencies
      Servicio de identidad.

when:
  turns:
    - "el PRD del ticket T-1 está en docs/daw/prd/prd-T-1.md y para mí está terminado. Validalo y presentámelo para que lo apruebe — no avances de fase sin mi ok."
  timeout: 1800

expect:
  # It did not cross: assisted, and the turn explicitly asked to wait for the
  # ok.
  state_phase: DEFINE
  # The shape the method promises the user, said by the model: DEFINE's status
  # line opens the response (📋 is its fixed marker) and the 🙋 banner closes
  # it, because the run was left waiting for an approval. The two emojis are
  # the STABLE anchors of the format — the text around them follows the
  # language of the conversation, the marker does not
  # (daw/orchestrator.md:298: "The `🙋` marker is fixed").
  transcript_matches:
    - matches: "📋"
    - matches: "🙋"

# The control: the two demands, removed from all their carriers in the
# orchestrator — the status line section, the banner's marker and the status
# line DEFINE's router repeats. If the model emits them anyway (it already
# happened with Claude Code and another rule: the behavior came from the
# model, not the prose), the scenario does not discriminate with that agent
# and it has to be said in this header, not hidden.
control:
  type: substitute
  edits:
    - path: daw/orchestrator.md
      installed_path: .daw/orchestrator.md
      old: "**Every response you give MUST start with a status line.** No exceptions."
      new: "A status line is optional decoration: skip it unless the user asks for one."
    - path: daw/orchestrator.md
      installed_path: .daw/orchestrator.md
      old: |-
        When a response ends waiting on the user — an arrow to approve, a commit to confirm, a question a
        gate hangs on — its last lines are this banner, and nothing comes after it.
      new: |-
        No closing banner is needed: end the response with the question itself, in plain prose.
    - path: daw/orchestrator.md
      installed_path: .daw/orchestrator.md
      old: "- **Status line:** `📋 {TIER} · Defining PRD [1/5] | {ticket}: {title}`"
      new: "- Status line: optional here."
