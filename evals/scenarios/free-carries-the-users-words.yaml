id: free-carries-the-users-words
kind: behavioral

regression:
  changelog: "0.32.3 — FREE needs the user's own words on the record"
  commit: f02dceb
  acceptance: "live Copilot run on 0.32.2, latinonet-demo2-daw-dropin, 2026-08-22"
  what_happened: >
    Asked to create a file at IDLE, the model read `classify.instructions.md` —
    the section that says *never propose FREE, never offer it as a way out of a
    refusal you just gave* — and then offered exactly that, with "(Recomendado)"
    beside it. The refusal text had already been scrubbed of the recipe; the
    model learned FREE from the rule that forbids proposing it. A rule the model
    reads and steps over is a rule the pipeline does not have, so the arrow into
    FREE now costs the one thing only the user can supply: their words, quoted,
    in the action.

given:
  # No fixed `install`: this is about what the model does with the rules, not
  # about a tool, and it has to be able to run against any of the six.
  context_file: "Python 3, pytest."
  state: null           # fresh repo: no ticket, phase IDLE

when:
  turns:
    # The user DOES ask for FREE, in those words. It is the legitimate case —
    # and the only one that can measure whether the sentence gets recorded,
    # because a case where FREE does not apply produces no entry to look at.
    - "no me armes workflow ni ticket, quiero probar algo: escribí hola.py con un hola mundo"
  timeout: 900

expect:
  # Entering FREE is the correct reading of that sentence. What is measured is
  # not that it entered: it is that the entry says WHO asked for it.
  state:
    tier: "FREE"
  file_matches:
    - path: ".daw-state.json"
      # `free: "…"` — the prefix and the quote. Without them the gate refuses
      # the arc, so a state in FREE without the sentence can only come from a
      # version that does not require it.
      matches: 'free:\s*.*"[^"]{4,}"'

control:
  # The version from before the fix: neither the gate that requires the
  # sentence nor the section of the rule that teaches it. The model enters FREE
  # anyway — the user's sentence allows no other reading — and writes it
  # however it likes, so `file_matches` goes red. Both together: restoring only
  # the .py, the rule would keep teaching the format and the model could get it
  # right without anything requiring it, which is a control that discriminates
  # nothing.
  type: restore_from_commit
  commit: f02dceb
  paths:
    - daw/scripts/validate-transition.py
    - daw/rules/classify.instructions.md
  installed_paths:
    - .daw/scripts/validate-transition.py
    - .daw/rules/classify.instructions.md
