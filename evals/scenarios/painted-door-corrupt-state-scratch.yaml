id: painted-door-corrupt-state-scratch
kind: painted-door

regression:
  changelog: "0.9.2 — Fixed: the corrupt-state refusal ordered a write it refused"
  commit: a6732fd
  what_happened: >
    With the state corrupt, the only recovery the product prescribes is "save
    the corrected content to a scratch file OUTSIDE the repo and hand the user
    a command to copy it". And the guard that refuses everything while the
    state is corrupt was applied before looking at the paths, so that write was
    refused too. Measured live: the model tried exactly what it had just been
    told, and was stopped. The painted door was in the recovery message, which
    is the worst place it can be — it is what gets read when everything has
    already gone wrong.

given:
  install: claude
  # The state, CORRUPT: it is the only condition in which this message is
  # emitted, and therefore the only one in which the painted door exists.
  # Written as raw text, which is what a corrupt state is.
  state: "{ this is not json"

when:
  instruction: daw/scripts/hook-gate.py
  probes:
    # The path the instruction names: a scratch outside the repo. `/tmp` is
    # where any obedient reader of "outside the repo" lands.
    # Absolute, not `<repo>/../x`: that form starts LEXICALLY with the repo,
    # and the guard looks at both readings of every path — resolved and
    # literal — on purpose, because a `.daw` symlinked outside made writing the
    # graph resolve outside the repo. So `<repo>/../scratch.json` is refused
    # and `/tmp/scratch.json` is not: only the second is what the instruction
    # asks for.
    - path: /tmp/daw-eval-scratch-state.json
      ordered_if_matches: '(?s)save it to a scratch file outside the repo'

expect:
  no_ordered_write_is_refused: true

# The control does NOT restore the historical file, and that is deliberate:
# the version of `validate-transition.py` before a6732fd does not accept the
# `--method` that `hook-gate.py` passes it today, so restoring it puts the
# control in red on `unrecognized arguments` — a crash, not the regression. And
# restoring both files together gives the same crash from the other side. A
# control that goes red for the wrong reason proves nothing, which is exactly
# what this mode exists to not let through.
#
# So the DEFECT is reinjected onto HEAD: without the early exit, no path is
# looked at and the scratch outside the repo is refused again. It is the same
# idiom `scripts/mutate.py` uses for this same regression, and it is immune to
# signature drift because it mutates today's tree.
control:
  type: substitute
  path: daw/scripts/validate-transition.py
  installed_path: .daw/scripts/validate-transition.py
  old: "    if (all(_outside_repo(t, root) for t in targets)\n            and all(_outside_repo(lex, root) for lex in lexicals)):\n        return None"
  new: "    if False:\n        return None"
